# Opt-in local-first Phase 1 composition. This tree deliberately has no agent
# loop, model-facing write tools, or implementation consumer.
- id: llm
  name: '@deepseek-ai/dsh-llm'

- id: llm-pi-ai
  name: '@deepseek-ai/dsh-llm-pi-ai'
  config:
    providers:
      lm-studio:
        displayName: LM Studio
        apiKeyEnv: LM_STUDIO_API_KEY
        api: openai-completions
        baseURL: !!js "process.env.LM_STUDIO_BASE_URL ?? 'http://127.0.0.1:1234/v1'"
        models:
          - id: !!js "process.env.LM_STUDIO_MODEL ?? 'local-model'"
            contextWindow: 32768
            maxTokens: 4096

- id: subprocess
  name: '@deepseek-ai/dsh-subprocess-local'

- id: shell
  name: '@deepseek-ai/dsh-bash-local'

- id: fs
  name: '@deepseek-ai/dsh-fs-local'
  config:
    cwd: !!js process.cwd()

- id: project-intake
  name: '@deepseek-ai/dsh-project-git-local'

- id: project-memory
  name: '@deepseek-ai/dsh-project-memory-local'
  config:
    path: !!js "process.env.DSH_PHASE1_MEMORY_PATH ?? `${process.cwd()}/.dsh/phase1-project-memory.json`"
    maxBytes: 262144

- id: project-planning
  name: '@deepseek-ai/dsh-project-planning'
